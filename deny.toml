# cargo-deny configuration. CI runs `cargo deny --manifest-path src-tauri/Cargo.toml check licenses`
# and fails if any crate's license is not on the allow list below.
# scripts/third-party.mjs checks the npm packages against the same list.
# With no [graph] targets set, cargo-deny checks the crates of every platform, not just the host.

[licenses]
# Only licenses the FSF lists as compatible with GPL-3.0. An "A OR B" crate passes when one of
# them is allowed; "A AND B" needs both.
allow = ["0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "GPL-3.0-only", "GPL-3.0-or-later", "ISC", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later", "MIT", "MIT-0", "MPL-2.0", "NCSA", "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "Zlib"]
# Left out on purpose because they are not GPL-3.0-compatible: GPL-2.0-only, the old OpenSSL
# license, Apache-1.1, EPL, CDDL. CDLA-Permissive-2.0 is left out because the FSF hasn't listed it.
confidence-threshold = 0.93
# The list is a policy, so allowed licenses that no crate uses today are fine.
unused-allowed-license = "allow"
