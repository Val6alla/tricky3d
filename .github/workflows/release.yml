name: Release

# Pushing a tag such as v0.1.0 builds the installers for every platform and attaches them to a
# draft GitHub release, which you review and publish by hand. Running this workflow by hand
# (Actions › Release › Run workflow) on a branch builds the same installers and puts them on the
# run page as downloadable artifacts instead. GitHub shows the Run workflow button only once this
# file is on the default branch; after that you can pick any branch.
#
# There are no signing certificates or secrets. The Mac app gets a free ad-hoc signature
# ("signingIdentity": "-" in src-tauri/tauri.conf.json): Apple Silicon Macs refuse to run code with
# no signature at all and call such a download "damaged". macOS still asks the user to allow the
# app once, as the README describes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new run for the same tag or branch cancels the old one, so two runs never upload to one draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-release:
    name: Draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check that the tag matches the app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "Tag $tag_version, package.json $package_version, tauri.conf.json $tauri_version, Cargo.toml $cargo_version"
          if [ "$package_version" != "$tag_version" ] || [ "$tauri_version" != "$tag_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the version in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml."
            exit 1
          fi

      # One job creates the release before the builds start, so the three build jobs can't each
      # create their own draft. When the whole workflow runs again for the same tag, it reuses the
      # draft and deletes its old installers first, so a build that fails this time leaves a missing
      # file rather than one from an older commit. "Re-run failed jobs" skips this job and keeps
      # the installers that built fine.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Unsigned builds for Apple Silicon Macs (macOS 13 or later), Windows and Linux. tricky3D is early and unfinished; see [Known limitations](${{ github.server_url }}/${{ github.repository }}#known-limitations).

            Mac: download the `.dmg` with Safari (Chrome may block it), open it and drag tricky3D to Applications. macOS blocks unsigned apps on first launch; [Installing](${{ github.server_url }}/${{ github.repository }}#installing) shows how to allow it once with Open Anyway.

            Windows: if SmartScreen warns, click More info, then Run anyway.
        run: |
          # The API can't look up a draft by its tag, so search the list of releases.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          id="${ids%%$'\n'*}"
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="tricky3D ${GITHUB_REF_NAME#v}" \
              -f body="$NOTES" \
              -F draft=true \
              --jq .id)
            echo "Created draft release $id"
          else
            echo "Reusing draft release $id"
            # Assigned first so that bash -e stops the step if the listing fails.
            assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[].id')
            for asset in $assets; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
          fi
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft-release
    # draft-release is skipped on manual runs from a branch; build anyway.
    if: ${{ !cancelled() && needs.draft-release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest # Apple Silicon
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: tricky3d-macos-arm64
            files: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ""
            artifact: tricky3d-windows-x64
            files: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            # The oldest available Ubuntu, so the AppImage runs on distributions with an older glibc.
            # GitHub retires this image in April 2027; move to ubuntu-24.04 before then.
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            artifact: tricky3d-linux-x64
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.rust-target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Without a release id (manual runs) the action only builds. On macOS it also packs
      # tricky3D.app into tricky3D.app.tar.gz next to it.
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft-release.outputs.release-id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

      - name: Upload the installers to the run page
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
