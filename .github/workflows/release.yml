name: Release

# Pushing a tag such as v0.2.0 runs the CI checks, builds the installers for every platform and
# attaches them to a draft GitHub release, which you review and publish by hand. Running this
# workflow by hand (Actions › Release › Run workflow) on a branch runs the same checks and builds
# and puts the installers on the run page as downloadable artifacts instead. GitHub shows the Run
# workflow button only once this file is on the default branch; after that you can pick any branch.
#
# There are no signing certificates or secrets. The Mac app gets a free ad-hoc signature
# ("signingIdentity": "-" in src-tauri/tauri.conf.json): Apple Silicon Macs refuse to run code with
# no signature at all and call such a download "damaged". macOS still asks the user to allow the
# app once, as INSTALL.md describes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new run for the same tag or branch cancels the old one, so two runs never upload to one draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks as CI, on all three platforms, before anything is built or released.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      macos: true

  draft-release:
    name: Draft release
    needs: checks
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check that the tag matches the app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "Tag $tag_version, package.json $package_version, tauri.conf.json $tauri_version, Cargo.toml $cargo_version"
          if [ "$package_version" != "$tag_version" ] || [ "$tauri_version" != "$tag_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the version in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml (scripts/bump-version sets all three)."
            exit 1
          fi

      # The notes start with the tag's message: the message of an annotated tag (git tag -a), or
      # the tagged commit's message for a plain tag. actions/checkout fetches the tagged commit and
      # points the tag straight at it, so fetch the tag itself to read an annotated tag's message.
      - name: Write the release notes
        env:
          INSTALL_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          {
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$GITHUB_REF_NAME"
            echo
            echo "**How to install:** follow [INSTALL.md]($INSTALL_URL), step by step for Mac, Windows and Linux. These installers aren't signed, so the first start shows a warning; the guide shows how to get past it."
            echo
            echo "Which file to download:"
            echo
            echo "- **Mac** (Apple Silicon or Intel, macOS 13 or later): \`tricky3D_${version}_universal.dmg\`"
            echo "- **Windows** (64-bit, Windows 10 or 11): \`tricky3D_${version}_x64-setup.exe\`"
            echo "- **Linux** (64-bit): \`tricky3D_${version}_amd64.AppImage\`, or \`tricky3D_${version}_amd64.deb\` on Debian and Ubuntu"
          } > notes.md
          cat notes.md

      # One job creates the release before the builds start, so the build jobs can't each create
      # their own draft. When the whole workflow runs again for the same tag, it reuses the draft,
      # updates its notes and deletes its old installers first, so a build that fails this time
      # leaves a missing file rather than one from an older commit. "Re-run failed jobs" skips this
      # job and keeps the installers that built fine.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The API can't look up a draft by its tag, so search the list of releases.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          id="${ids%%$'\n'*}"
          if [ -z "$id" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > /dev/null 2>&1; then
              echo "::error::$GITHUB_REF_NAME is already published. Push a new tag instead of rebuilding a published release."
              exit 1
            fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="tricky3D $GITHUB_REF_NAME" \
              -F body=@notes.md \
              -F draft=true \
              --jq .id)
            echo "Created draft release $id"
          else
            echo "Reusing draft release $id"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@notes.md > /dev/null
            # Assigned first so that bash -e stops the step if the listing fails.
            assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[].id')
            for asset in $assets; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [checks, draft-release]
    # draft-release is skipped on manual runs from a branch; build anyway, but only after the checks passed.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.draft-release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            # One app for Apple Silicon and Intel Macs: Tauri builds both and joins them.
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact: tricky3d-macos-universal
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
            artifact: tricky3d-windows-x64
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: Linux x64
            # The oldest available Ubuntu, so the AppImage runs on distributions with an older glibc.
            # GitHub retires this image in April 2027; move to ubuntu-24.04 before then.
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            artifact: tricky3d-linux-x64
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the frontend in production mode first (beforeBuildCommand), then the Rust release
      # build and the installers.
      - name: Build the installers
        shell: bash
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Attach the installers to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          # Unquoted on purpose: one path pattern per line, each expanded by the shell. A pattern
          # that matches nothing stays as written and makes the upload fail.
          gh release upload "$GITHUB_REF_NAME" $FILES --clobber

      - name: Upload the installers to the run page
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
