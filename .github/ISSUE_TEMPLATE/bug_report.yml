name: Bug report
description: Something doesn't work or gives a wrong result.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Copy any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a file…
        2. Select…
        3. Click…
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File
      description: If a particular file causes it, attach it here (zip it first if GitHub refuses the file type). Anything you attach is public, so only share files you're allowed to.
  - type: input
    id: version
    attributes:
      label: tricky3D version
      description: File › About tricky3D
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 26.1, Windows 11 24H2, Ubuntu 24.04…
